<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e2e417" />
  <title>시대에듀 기분좋은 보디빌딩 구술 랜덤카드</title>
  <style>
    :root {
      --lime: #e2e417;
      --cyan: #08ace2;
      --ice: #cceef8;
      --pink: #f5007d;
      --orange: #ff7a00;
      --ink: #171820;
      --white: #ffffff;
      --primary-color: var(--lime);
      --bg-color: var(--lime);
      --card-bg: var(--white);
      --text-main: var(--ink);
      --text-sub: #4d5660;
      --border-color: var(--ink);
    }

    * { box-sizing: border-box; }

    html { background: var(--ink); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--ink);
    }

    .progress-container {
      width: 100%;
      height: 15px;
      overflow: hidden;
      background: rgba(255,255,255,.55);
      border: 3px solid var(--ink);
      border-radius: 4px;
      box-shadow: 4px 4px 0 var(--cyan);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--pink);
      transition: width .3s ease, background-color .2s ease;
    }

    .progress-bar.review-active { background: var(--orange); }

    .wrap {
      width: min(100vw, 520px, calc(100dvh * 9 / 16));
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(168deg, transparent 0 81%, var(--cyan) 81.2% 100%),
        var(--lime);
      box-shadow: 0 0 0 3px var(--ink);
    }

    .wrap::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -92px;
      top: 36%;
      border: 24px solid rgba(8,172,226,.35);
      transform: rotate(18deg);
      pointer-events: none;
    }

    .study-panel {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 10px 0 12px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: 10px;
      position: relative;
      z-index: 1;
      background: transparent;
    }

    header {
      text-align: left;
      line-height: 1;
    }

    .brand {
      margin: 0 0 7px 2px;
      color: var(--ink);
      font-size: clamp(12px, 3.4vw, 16px);
      font-weight: 1000;
      letter-spacing: -.06em;
    }

    .title-box {
      display: inline-block;
      padding: 8px 14px 10px;
      background: var(--ink);
      box-shadow: 7px 7px 0 var(--cyan);
      transform: skew(-7deg) rotate(-1deg);
    }

    header h1 {
      margin: 0;
      color: var(--white);
      font-size: clamp(23px, 6.8vw, 34px);
      font-weight: 1000;
      line-height: 1.02;
      letter-spacing: -.055em;
      text-shadow: none;
      transform: skew(7deg);
    }

    .subtitle {
      margin: 10px 0 0 2px;
      color: var(--pink);
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .progress-area {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    #statusLine {
      min-width: 60px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 1000;
      text-align: center;
    }

    .main-card {
      position: relative;
      min-height: 0;
      padding: 30px 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      text-align: center;
      background: rgba(255,255,255,.96);
      border: 4px solid var(--ink);
      border-radius: 4px;
      box-shadow: 10px 10px 0 var(--ink);
    }

    .question-text {
      max-width: 100%;
      font-size: clamp(22px, 6.4vw, 34px);
      font-weight: 1000;
      line-height: 1.42;
      letter-spacing: -.045em;
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      border: 3px solid var(--ink);
      border-radius: 4px;
      background: var(--ice);
      box-shadow: 7px 7px 0 var(--ink);
    }

    button {
      min-height: 46px;
      padding: 11px 8px;
      border: 3px solid var(--ink);
      border-radius: 3px;
      color: var(--ink);
      background: var(--white);
      font-family: inherit;
      font-size: clamp(12px, 3.5vw, 15px);
      font-weight: 1000;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn-main { background: var(--pink); color: var(--white); }
    .btn-sub { background: var(--white); color: var(--ink); }
    #unsureBtn { background: var(--cyan); color: var(--ink); }
    #confidentBtn { background: var(--pink); color: var(--white); }
    #reviewBtn { background: var(--white); color: var(--ink); }
    #reviewBtn.review-active { background: var(--orange); color: var(--white); }
    #reshuffleBtn { background: var(--white); color: var(--ink); }
    .controls.review-complete #confidentBtn,
    .controls.review-complete #reshuffleBtn,
    .controls.review-cleared #unsureBtn,
    .controls.review-cleared #confidentBtn,
    .controls.review-cleared #reshuffleBtn {
      display: none;
    }
    .controls.review-complete #unsureBtn {
      background: var(--orange);
      color: var(--white);
    }
    .controls.review-complete #reviewBtn,
    .controls.review-cleared #reviewBtn {
      background: var(--white);
      color: var(--ink);
    }
    .controls.review-cleared #reviewBtn {
      grid-column: 1 / -1;
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none !important;
    }

    .copyright {
      margin: 0;
      padding: 0 4px;
      color: rgba(23,24,32,.72);
      font-size: clamp(8px, 2.25vw, 10px);
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -.025em;
      text-align: center;
      word-break: keep-all;
    }

    @media (max-width: 380px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      .main-card { padding-left: 20px; padding-right: 20px; }
      .controls { gap: 5px; padding: 6px; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <section class="study-panel" aria-label="구술카드 학습">
    <header>
      <div class="brand">기분좋은 스포츠지도사 2급 보디빌딩 실기+구술 한 권에 합격</div>
      <div class="title-box">
        <h1>보디빌딩 구술 랜덤카드</h1>
      </div>
      <p class="subtitle">#시대에듀 #2주 합격 프로젝트 #핵심구술</p>
    </header>

    <div class="progress-area" aria-label="학습 진행률">
      <div id="statusLine"></div>
      <div class="progress-container">

        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <main class="main-card">
      <div class="question-text" id="question">학습 시작을 위해 '다음'을 누르세요.</div>
    </main>

    <div class="controls" id="controls">
      <button id="unsureBtn">한 번 더 연습할래요</button>
      <button id="confidentBtn">확실히 설명할 수 있어요</button>
      <button id="reviewBtn">다시 연습할 카드</button>
      <button id="reshuffleBtn">카드 섞기</button>
    </div>
    <p class="copyright">
      *본 구술카드의 고유한 구성과 구현물을 무단으로 모방하거나 상업적으로 이용하는 것을 금합니다.<br>
      *교재 구매 고객의 개인 학습 용도로만 제공되며, 무단 배포·공유 적발 시 서비스 이용이 중단될 수 있습니다.<br>

    </p>
    </section>
  </div>

데피니션에 대해 설명하시오.

무산소성 역치에 대해 설명하시오.
교감신경과 부교감신경에 대해 설명하시오.
지근과 속근에 대해 설명하시오.

카르보넨 공식에 대해 설명하시오.
이화작용(카타볼릭)에 대해 설명하시오.
수의근과 불수의근에 대해 설명하시오.
에너지대사, 시스템 3가지(유산소와 무산소 시스템 체계)에 대해 설명하시오.
BCAA 효능에 대해 설명하시오.
응급 처치 3C에 대해 설명하시오.
의식 없을 환자 경우 응급 처치에 대해 설명하시오.
출혈이 있는 환자의 응급 처치에 대해 설명하시오.
운동 손상 시 기본 처치 방법에 대해 설명하시오.
기도 폐쇄의 유형에 대해 설명하시오.
생활체육 지도자의 역할에 대해 설명하시오.
생활체육의 목표 5가지에 대해 설명하시오.
스포츠지도사의 유의사항에 대해 설명하시오.
노화에 따른 신체적 변화 7가지에 대해 설명하시오.
유소년의 발달 형태에 대해 설명하시오.

  `;

  const questions = questionsText
    .split(/\r?\n/)
    .map(question => question.trim())
    .filter(Boolean);
  const STORAGE_KEY = "bodybuildingOralCardProgressV2";
  const REVIEW_STORAGE_KEY = "bodybuildingOralCardReviewV1";
  document.documentElement.dataset.seBuild = "SDEDU-JHJ-20260825";
  let order = [];
  let index = 0;
  let mode = "all";
  let reviewQuestions = [];

  const $q = document.getElementById("question");
  const $progress = document.getElementById("progressBar");
  const $statusLine = document.getElementById("statusLine");
  const $controls = document.getElementById("controls");
  const $unsureBtn = document.getElementById("unsureBtn");
  const $confidentBtn = document.getElementById("confidentBtn");
  const $reviewBtn = document.getElementById("reviewBtn");
  const $reshuffleBtn = document.getElementById("reshuffleBtn");

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function makeOrder() {
    if (questions.length === 0) { order = []; index = 0; return; }
    mode = "all";
    order = [...Array(questions.length).keys()];
    shuffle(order);
    index = 0;
    saveProgress();
  }

  function isValidSavedOrder(savedOrder) {
    if (!Array.isArray(savedOrder)) return false;
    if (savedOrder.some(value => !Number.isInteger(value) || value < 0 || value >= questions.length)) return false;
    return new Set(savedOrder).size === savedOrder.length;
  }

  function loadReviewQuestions() {
    try {
      const saved = JSON.parse(localStorage.getItem(REVIEW_STORAGE_KEY));
      if (Array.isArray(saved)) {
        reviewQuestions = [...new Set(saved)].filter(question => questions.includes(question));
      }
    } catch (error) {
      reviewQuestions = [];
    }
  }

  function saveReviewQuestions() {
    try {
      localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(reviewQuestions));
    } catch (error) {
      // 저장이 제한된 브라우저에서도 현재 실행 중에는 목록을 유지합니다.
    }
  }

  function currentQuestion() {
    return index < order.length ? questions[order[index]] : null;
  }

  function addCurrentToReview() {
    const question = currentQuestion();
    if (question && !reviewQuestions.includes(question)) {
      reviewQuestions.push(question);
      saveReviewQuestions();
    }
  }

  function removeCurrentFromReview() {
    const question = currentQuestion();
    if (!question) return;
    reviewQuestions = reviewQuestions.filter(item => item !== question);
    saveReviewQuestions();
  }

  function startReview() {
    const validReviewQuestions = reviewQuestions.filter(question => questions.includes(question));
    reviewQuestions = [...new Set(validReviewQuestions)];
    saveReviewQuestions();

    if (reviewQuestions.length === 0) {
      alert("다시 연습할 카드가 없습니다.");
      return;
    }

    mode = "review";
    order = reviewQuestions.map(question => questions.indexOf(question));
    shuffle(order);
    index = 0;
    saveProgress();
    render();
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ order, index, mode }));
    } catch (error) {
      // 저장이 제한된 브라우저에서도 학습 기능은 계속 동작합니다.
    }
  }

  function restoreProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (
        saved &&
        isValidSavedOrder(saved.order) &&
        Number.isInteger(saved.index) &&
        saved.index >= 0 &&
        saved.index <= saved.order.length &&
        (saved.mode === "all" || saved.mode === "review")
      ) {
        order = saved.order;
        index = saved.index;
        mode = saved.mode;
        return true;
      }
    } catch (error) {
      // 손상되거나 사용할 수 없는 저장값은 새 학습으로 대체합니다.
    }
    return false;
  }

  function render() {
    const isReviewMode = mode === "review";
    const isReviewComplete = isReviewMode && index === order.length;
    const hasRemainingReview = reviewQuestions.length > 0;
    $progress.classList.toggle("review-active", isReviewMode);
    $reviewBtn.classList.toggle("review-active", isReviewMode);
    $controls.classList.toggle("review-complete", isReviewComplete && hasRemainingReview);
    $controls.classList.toggle("review-cleared", isReviewComplete && !hasRemainingReview);

    if (questions.length === 0) {
      $q.textContent = "코드에 등록된 문항이 없습니다.";
      $statusLine.textContent = "0 / 0";
      $progress.style.width = "0%";
      $unsureBtn.disabled = true;
      $confidentBtn.disabled = true;
      $reviewBtn.disabled = true;
      $reshuffleBtn.disabled = true;
      return;
    }

    if (index === order.length) {
      if (isReviewMode) {
        $q.textContent = hasRemainingReview
          ? `이번 회차 연습을 마쳤습니다.\n다시 연습할 카드가 ${reviewQuestions.length}개 남아 있습니다.`
          : "다시 연습할 카드를 모두 완료했습니다!";
      } else {
        $q.textContent = "전체 문항을 완료했습니다.";
      }
      $statusLine.textContent = `${order.length} / ${order.length}`;
      $progress.style.width = "100%";
      $unsureBtn.disabled = !(isReviewMode && hasRemainingReview);
      $unsureBtn.textContent = isReviewMode && hasRemainingReview
        ? "남은 카드 다시 연습"
        : "한 번 더 연습할래요";
      $confidentBtn.disabled = true;
      $reviewBtn.disabled = false;
      $reviewBtn.textContent = isReviewMode
        ? "전체 카드로 돌아가기"
        : `다시 연습할 카드 (${reviewQuestions.length})`;
      saveProgress();
      return;
    }

    const realIdx = order[index];
    $unsureBtn.textContent = "한 번 더 연습할래요";
    $q.textContent = questions[realIdx];
    $statusLine.textContent = `${index + 1} / ${order.length}`;
    const percent = ((index + 1) / order.length) * 100;
    $progress.style.width = `${percent}%`;
    $unsureBtn.disabled = false;
    $confidentBtn.disabled = false;
    $reviewBtn.disabled = false;
    $reviewBtn.textContent = mode === "review"
      ? "전체 카드로 돌아가기"
      : `다시 연습할 카드 (${reviewQuestions.length})`;
    saveProgress();
  }

  $unsureBtn.addEventListener("click", () => {
    if (mode === "review" && index === order.length && reviewQuestions.length > 0) {
      startReview();
      return;
    }
    addCurrentToReview();
    index++;
    render();
  });

  $confidentBtn.addEventListener("click", () => {
    removeCurrentFromReview();
    index++;
    render();
  });

  $reviewBtn.addEventListener("click", () => {
    if (mode === "review") {
      makeOrder();
      render();
      return;
    }
    startReview();
  });

  $reshuffleBtn.addEventListener("click", () => {
    if (index > 0 && index < order.length) {
      const shouldShuffle = confirm("진행 상황을 초기화하고 다시 섞을까요?");
      if (!shouldShuffle) return;
    }
    if (mode === "review") {
      startReview();
      return;
    }
    makeOrder();
    render();
  });

  loadReviewQuestions();
  if (!restoreProgress()) makeOrder();
  render();
</script>
</body>
</html>
